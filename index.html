<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Curated Closet · Sloane Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0d0e11;
      --card-bg: #15171c;
      --card-border: #232730;
      --accent: #c49d64; /* Sartorial Warm Cognac */
      --accent-dim: rgba(196, 157, 100, 0.12);
      --text: #f3f4f6;
      --text-muted: #8b92a0;
      --pill-bg: #1d212a;
      --danger: #ef4444;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 80px) 16px;
      line-height: 1.5;
    }

    header {
      padding: 16px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 24px;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    .brand-subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-top: 2px;
    }

    /* Navigation */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(13, 14, 17, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      z-index: 999;
    }
    .nav-btn {
      flex: 1;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--accent);
    }

    /* Sub-bar / Location Pill */
    .board-subbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
    }
    .location-pill {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .location-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Sloane Briefing Card */
    .briefing-card {
      background: linear-gradient(145deg, #181b22, #121419);
      border: 1px solid rgba(196, 157, 100, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .briefing-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .briefing-text {
      font-family: var(--font-serif);
      font-size: 14px;
      line-height: 1.6;
      color: #e5e7eb;
      font-style: italic;
    }

    /* Action Button */
    .btn-curate {
      width: 100%;
      background: var(--accent);
      color: #0b0c0e;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 20px;
      transition: opacity 0.2s;
    }
    .btn-curate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Notice Banner */
    .engine-notice {
      background: #1f1a14;
      border: 1px solid #4a3820;
      color: #e2ba7d;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }

    /* Day Card */
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .day-card-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid #1f232b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .day-card-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .day-weather-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--pill-bg);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #232730;
      white-space: nowrap;
    }
    .activity-selector {
      width: 100%;
      background: #101216;
      border: 1px solid #232730;
      color: var(--text);
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      outline: none;
    }

    .outfit-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .slot-box {
      background: #101216;
      border: 1px solid #1e222a;
      border-radius: 8px;
      padding: 10px;
    }
    .slot-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .slot-value {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .day-rationale {
      font-size: 12px;
      color: #9ca3af;
      font-style: italic;
      border-left: 2px solid var(--accent);
      padding-left: 8px;
      margin-top: 6px;
    }

    /* Vault Grid */
    .vault-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .garment-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .garment-brand {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .garment-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }
    .garment-meta {
      font-size: 11px;
      color: var(--text-muted);
    }
    .anchor-btn {
      margin-top: 6px;
      background: #1a1e26;
      border: 1px solid #2a303c;
      color: #cbd5e1;
      padding: 5px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .anchor-btn.locked {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: none;
      align-items: flex-end;
      z-index: 1000;
    }
    .modal-sheet {
      background: #16181f;
      border-top: 1px solid #2a303c;
      width: 100%;
      border-radius: 16px 16px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)) 16px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title {
      font-family: var(--font-serif);
      font-size: 18px;
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: #0f1014;
      border: 1px solid #262a34;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">Curated Closet</div>
      <div class="brand-subtitle">Sloane Styling Engine</div>
    </div>
  </header>

  <!-- TAB 1: 7-DAY BOARD -->
  <main id="tab-board">
    <div class="board-subbar">
      <button class="location-pill" onclick="promptChangeLocation()">
        📍 <span id="location-pill-label">Minnetonka, MN</span> ▾
      </button>
      <span class="location-hint">Tap city to edit</span>
    </div>

    <div id="engine-notice-bar" class="engine-notice"></div>

    <div id="briefing-box" class="briefing-card" style="display:none;">
      <div class="briefing-header">Sloane Sartorial Direction</div>
      <div id="briefing-text-content" class="briefing-text"></div>
    </div>

    <button id="curate-button" class="btn-curate" onclick="invokeSloaneCuration()">
      Curate Week with Sloane
    </button>

    <div id="board-cards-container">
      <!-- Monday through Friday cards render dynamically -->
    </div>
  </main>

  <!-- TAB 2: CLOSET VAULT -->
  <main id="tab-vault" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div>
        <h2 style="font-size:18px; font-weight:600;">Wardrobe Vault</h2>
        <p style="font-size:12px; color:var(--text-muted);" id="vault-count">0 Garments Indexed</p>
      </div>
      <button onclick="openAddModal()" style="background:var(--accent); color:#000; border:none; padding:8px 14px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;">
        + Add Piece
      </button>
    </div>

    <div id="vault-grid" class="vault-grid">
      <!-- Catalog items render dynamically -->
    </div>
  </main>

  <!-- ADD PIECE / VISION MODAL -->
  <div id="add-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 class="modal-title">Intake Garment</h3>
        <button onclick="closeAddModal()" style="background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">✕</button>
      </div>

      <div class="form-group">
        <label>Flat-Lay Camera / Photo Snap</label>
        <input type="file" id="camera-file-input" accept="image/*" capture="environment" onchange="handleImageIntake(event)">
      </div>

      <div id="vision-status" style="font-size:11px; color:var(--accent); margin-bottom:10px; display:none;">
        Analyzing garment geometry and fabric signatures...
      </div>

      <div class="form-group">
        <label>Brand / Label</label>
        <input type="text" id="piece-brand" placeholder="e.g. Vuori, Relwen, Peter Millar">
      </div>

      <div class="form-group">
        <label>Garment Name</label>
        <input type="text" id="piece-name" placeholder="e.g. Oatmeal Herringbone Sport Coat">
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="piece-category">
          <option value="Top">Top</option>
          <option value="Layer">Layer</option>
          <option value="Bottom">Bottom</option>
          <option value="Footwear">Footwear</option>
        </select>
      </div>

      <div class="form-group">
        <label>Sub-Category</label>
        <input type="text" id="piece-subcategory" placeholder="e.g. Oxford, Knit, Chino, Sneaker">
      </div>

      <div class="form-group">
        <label>Color</label>
        <input type="text" id="piece-color" placeholder="e.g. Navy, Tobacco, Charcoal">
      </div>

      <div class="form-group">
        <label>Formality</label>
        <select id="piece-formality">
          <option value="Executive Casual">Executive Casual</option>
          <option value="Casual">Casual</option>
          <option value="Business Formal">Business Formal</option>
        </select>
      </div>

      <button onclick="saveGarment()" style="width:100%; background:var(--accent); color:#000; border:none; padding:12px; border-radius:6px; font-weight:600; cursor:pointer; margin-top:8px;">
        Save to Vault
      </button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="nav-bar">
    <button class="nav-btn active" id="btn-nav-board" onclick="switchTab('board')">
      <span>🗓️</span>
      <span>7-Day Board</span>
    </button>
    <button class="nav-btn" id="btn-nav-vault" onclick="switchTab('vault')">
      <span>👔</span>
      <span>Closet Vault</span>
    </button>
  </nav>

  <script>
    // --- 1. SUPABASE CLIENT INITIALIZATION ---
    const SUPABASE_URL = "https://rqiuuzeatlhyxfgwvuaa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxaXV1emVhdGloeXhmZ3d2dWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzODc3MzksImV4cCI6MjA1NTk2MzczOX0.8N8_eUj0Nq5U-L4w2J9L3Wk5mZ6L2B5U7T3S4Q2K1E8"; // Auto-configured production client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const WORKWEEK_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const DEFAULT_LOCATION = { name: "Minnetonka, MN", lat: 44.9133, lon: -93.4708 };

    // State Variables
    let wardrobe = [];
    let currentCuration = null;
    let heroAnchor = null; // { day: 'Tuesday', garmentId: 'uuid' }
    let currentLocation = JSON.parse(localStorage.getItem("curated_closet_location")) || DEFAULT_LOCATION;
    let dailyWeatherMap = {};
    let dailyActivities = JSON.parse(localStorage.getItem("curated_closet_activities")) || {
      Monday: "Executive Casual / Office",
      Tuesday: "In-Person Meeting",
      Wednesday: "Work From Home / Focus",
      Thursday: "Executive Casual / Office",
      Friday: "Client Dinner / Evening"
    };

    // --- 2. WEATHER & LOCATION SUBSYSTEM ---
    function parseWeatherCode(code) {
      if (code === 0) return "Clear";
      if (code <= 3) return "Partly Cloudy";
      if (code <= 48) return "Fog";
      if (code <= 67) return "Rain/Showers";
      if (code <= 77) return "Snow";
      return "Overcast";
    }

    async function fetchForecast(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.daily) {
          WORKWEEK_DAYS.forEach((day, idx) => {
            const max = Math.round(data.daily.temperature_2m_max[idx]);
            const min = Math.round(data.daily.temperature_2m_min[idx]);
            const cond = parseWeatherCode(data.daily.weathercode[idx]);
            dailyWeatherMap[day] = { max, min, cond, summary: `${max}°F / ${min}°F · ${cond}` };
          });
          renderBoard();
        }
      } catch (err) {
        console.warn("Weather fetch fallback:", err);
      }
    }

    async function promptChangeLocation() {
      const input = prompt("Enter city name or zip code:", currentLocation.name);
      if (!input || !input.trim()) return;

      try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(input.trim())}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();
        if (geoData.results && geoData.results.length > 0) {
          const match = geoData.results[0];
          currentLocation = {
            name: `${match.name}, ${match.admin1_code || match.country_code}`,
            lat: match.latitude,
            lon: match.longitude
          };
          localStorage.setItem("curated_closet_location", JSON.stringify(currentLocation));
          document.getElementById("location-pill-label").innerText = currentLocation.name;
          await fetchForecast(currentLocation.lat, currentLocation.lon);
        } else {
          alert("City not found. Please try another search.");
        }
      } catch (err) {
        alert("Location lookup error: " + err.message);
      }
    }

    function setDayActivity(day, activity) {
      dailyActivities[day] = activity;
      localStorage.setItem("curated_closet_activities", JSON.stringify(dailyActivities));
    }

    // --- 3. WARDROBE VAULT & DATA SUBSYSTEM ---
    async function loadWardrobe() {
      try {
        const { data, error } = await supabaseClient.from("garments").select("*").order("created_at", { ascending: false });
        if (error) throw error;
        wardrobe = data || [];
        document.getElementById("vault-count").innerText = `${wardrobe.length} Garments Indexed`;
        renderVault();
        renderBoard();
      } catch (err) {
        console.error("Failed to load wardrobe:", err);
      }
    }

    function renderVault() {
      const container = document.getElementById("vault-grid");
      if (!container) return;
      if (wardrobe.length === 0) {
        container.innerHTML = `<p style="grid-column:span 2; font-size:12px; color:var(--text-muted); text-align:center; padding:20px;">Vault empty. Tap + Add Piece to index your attire.</p>`;
        return;
      }

      container.innerHTML = wardrobe.map(g => `
        <div class="garment-card">
          <div class="garment-brand">${g.brand || 'Unbranded'}</div>
          <div class="garment-name">${g.name}</div>
          <div class="garment-meta">${g.category} · ${g.color || ''}</div>
          <div class="garment-meta" style="font-size:10px; color:#6b7280;">${g.formality || 'Executive Casual'}</div>
          <button class="anchor-btn ${heroAnchor?.garmentId === g.id ? 'locked' : ''}" onclick="toggleAnchor('${g.id}')">
            ${heroAnchor?.garmentId === g.id ? '⚓ Locked as Anchor' : 'Set as Anchor'}
          </button>
        </div>
      `).join("");
    }

    function toggleAnchor(garmentId) {
      if (heroAnchor?.garmentId === garmentId) {
        heroAnchor = null;
      } else {
        const targetDay = prompt("Assign this anchor to which day? (Monday, Tuesday, Wednesday, Thursday, Friday):", "Tuesday");
        if (WORKWEEK_DAYS.includes(targetDay)) {
          heroAnchor = { day: targetDay, garmentId: garmentId };
        }
      }
      renderVault();
    }

    // --- 4. BOARD RENDERING & CURATION ENGINE ---
    function renderBoard() {
      const container = document.getElementById("board-cards-container");
      if (!container) return;

      container.innerHTML = WORKWEEK_DAYS.map(day => {
        const dayPlan = currentCuration?.days?.[day];
        const topItem = wardrobe.find(g => g.id === dayPlan?.top_id);
        const layerItem = wardrobe.find(g => g.id === dayPlan?.layer_id);
        const bottomItem = wardrobe.find(g => g.id === dayPlan?.bottom_id);
        const footItem = wardrobe.find(g => g.id === dayPlan?.footwear_id);

        const weatherText = dailyWeatherMap[day]?.summary || "Syncing weather...";
        const currentActivity = dailyActivities[day] || "Executive Casual / Office";

        return `
          <div class="day-card">
            <div class="day-card-header">
              <div class="day-card-row1">
                <span class="day-name">${day}</span>
                <span class="day-weather-badge">${weatherText}</span>
              </div>
              <select class="activity-selector" onchange="setDayActivity('${day}', this.value)">
                <option value="Executive Casual / Office" ${currentActivity === 'Executive Casual / Office' ? 'selected' : ''}>Executive Casual / Office</option>
                <option value="In-Person Meeting" ${currentActivity === 'In-Person Meeting' ? 'selected' : ''}>In-Person Meeting (Formal)</option>
                <option value="Work From Home / Focus" ${currentActivity === 'Work From Home / Focus' ? 'selected' : ''}>Work From Home / Focus</option>
                <option value="Client Dinner / Evening" ${currentActivity === 'Client Dinner / Evening' ? 'selected' : ''}>Client Dinner / Evening</option>
                <option value="Travel / Transit" ${currentActivity === 'Travel / Transit' ? 'selected' : ''}>Travel / Transit</option>
              </select>
            </div>

            <div class="outfit-slots">
              <div class="slot-box">
                <div class="slot-label">Top</div>
                <div class="slot-value">${topItem ? topItem.name : '—'}</div>
              </div>
              <div class="slot-box">
                <div class="slot-label">Layer</div>
                <div class="slot-value">${layerItem ? layerItem.name : '—'}</div>
              </div>
              <div class="slot-box">
                <div class="slot-label">Bottom</div>
                <div class="slot-value">${bottomItem ? bottomItem.name : '—'}</div>
              </div>
              <div class="slot-box">
                <div class="slot-label">Footwear</div>
                <div class="slot-value">${footItem ? footItem.name : '—'}</div>
              </div>
            </div>

            ${dayPlan?.rationale ? `<div class="day-rationale">${dayPlan.rationale}</div>` : ''}
          </div>
        `;
      }).join("");
    }

    async function invokeSloaneCuration() {
      const btn = document.getElementById("curate-button");
      const noticeBar = document.getElementById("engine-notice-bar");
      noticeBar.style.display = "none";

      if (wardrobe.length < 5) {
        alert("Please add at least 5-10 garments to the Closet Vault before curating.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Sloane is Curating Rotation...";

      try {
        const dailySchedules = {};
        WORKWEEK_DAYS.forEach(day => {
          dailySchedules[day] = {
            weather: dailyWeatherMap[day]?.summary || "54°F · Clear",
            activity: dailyActivities[day] || "Executive Casual / Office"
          };
        });

        const res = await fetch(`${SUPABASE_URL}/functions/v1/curate-week`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY
          },
          body: JSON.stringify({
            locationName: currentLocation.name,
            garments: wardrobe,
            heroAnchor: heroAnchor,
            dailySchedules: dailySchedules
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        currentCuration = data;
        
        // Render briefing
        if (data.executiveBriefing) {
          document.getElementById("briefing-box").style.display = "block";
          document.getElementById("briefing-text-content").innerText = `"${data.executiveBriefing}"`;
        }

        renderBoard();

      } catch (err) {
        console.error("Curation failure:", err);
        noticeBar.style.display = "block";
        noticeBar.innerText = "Sloane engine notice: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Curate Week with Sloane";
      }
    }

    // --- 5. VISION INTAKE SUBSYSTEM ---
    function openAddModal() {
      document.getElementById("add-modal").style.display = "flex";
    }

    function closeAddModal() {
      document.getElementById("add-modal").style.display = "none";
      document.getElementById("camera-file-input").value = "";
      document.getElementById("vision-status").style.display = "none";
    }

    async function handleImageIntake(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById("vision-status");
      status.style.display = "block";
      status.innerText = "Analyzing fabric, label, and category with Sloane Vision...";

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const base64 = reader.result;
          const res = await fetch(`${SUPABASE_URL}/functions/v1/tag-garment`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY
            },
            body: JSON.stringify({ imageBase64: base64 })
          });

          const tags = await res.json();
          if (tags.error) throw new Error(tags.error);

          if (tags.brand) document.getElementById("piece-brand").value = tags.brand;
          if (tags.name) document.getElementById("piece-name").value = tags.name;
          if (tags.category) document.getElementById("piece-category").value = tags.category;
          if (tags.sub_category) document.getElementById("piece-subcategory").value = tags.sub_category;
          if (tags.color) document.getElementById("piece-color").value = tags.color;
          if (tags.formality) document.getElementById("piece-formality").value = tags.formality;

          status.innerText = "Analysis complete. Tags applied.";
        } catch (err) {
          status.innerText = "Vision analysis skipped: " + err.message;
        }
      };
      reader.readAsDataURL(file);
    }

    async function saveGarment() {
      const name = document.getElementById("piece-name").value.trim();
      const brand = document.getElementById("piece-brand").value.trim();
      const category = document.getElementById("piece-category").value;
      const sub_category = document.getElementById("piece-subcategory").value.trim();
      const color = document.getElementById("piece-color").value.trim();
      const formality = document.getElementById("piece-formality").value;

      if (!name) {
        alert("Please enter a garment name");
        return;
      }

      try {
        const { error } = await supabaseClient.from("garments").insert([{
          name, brand, category, sub_category, color, formality
        }]);

        if (error) throw error;
        closeAddModal();
        await loadWardrobe();
      } catch (err) {
        alert("Failed to save garment: " + err.message);
      }
    }

    // --- 6. NAVIGATION TABS ---
    function switchTab(tab) {
      document.getElementById("tab-board").style.display = tab === "board" ? "block" : "none";
      document.getElementById("tab-vault").style.display = tab === "vault" ? "block" : "none";
      document.getElementById("btn-nav-board").classList.toggle("active", tab === "board");
      document.getElementById("btn-nav-vault").classList.toggle("active", tab === "vault");
    }

    // --- 7. INITIALIZATION ON LOAD ---
    window.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("location-pill-label").innerText = currentLocation.name;
      await fetchForecast(currentLocation.lat, currentLocation.lon);
      await loadWardrobe();
    });
  </script>
</body>
</html>
