<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Curated Closet">

  <script src="https://unpkg.com/lucide@latest"></script>

        extend: {

            brand: {

              charcoal: '#1E293B',

  <style>

      border: 1.5px solid #C5B294 !important;

</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased pb-24">

  <!-- AUTH SCREEN -->

    <div class="w-full max-w-sm p-6 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl text-center">
      <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-zinc-800 flex items-center justify-center border border-zinc-700">
        <i data-lucide="sparkles" class="w-6 h-6 text-brand-brass"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white mb-1">Curated Closet</h1>
      <p class="text-xs text-zinc-400 mb-6">Executive Wardrobe Architecture</p>
      
      <form id="authForm" class="space-y-3">
        <input type="email" id="authEmail" required placeholder="Enter your email address" 
               class="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-sm focus:outline-none focus:border-brand-brass text-white placeholder-zinc-500">
        <button type="submit" id="authSubmitBtn" 
                class="w-full py-2.5 bg-brand-brass hover:bg-brand-brassLight text-zinc-950 font-semibold text-sm rounded-xl transition duration-150">

        </button>
      </form>
      
      <div id="authNotice" class="text-xs text-emerald-400 mt-4 hidden"></div>
      <div id="authError" class="text-xs text-rose-400 mt-4 hidden text-left bg-rose-950/40 p-2.5 rounded-lg border border-rose-900/50"></div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer" class="hidden max-w-5xl mx-auto px-4 pt-6">
    
    <!-- HEADER -->
    <header class="flex items-center justify-between pb-6 border-b border-zinc-800">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold text-white tracking-wide">CURATED CLOSET</h1>
          <span class="text-[10px] tracking-widest px-2 py-0.5 rounded-full bg-zinc-800 text-brand-brass uppercase font-semibold border border-zinc-700">
            Sloane Engine
          </span>
        </div>
        <p id="userEmailDisplay" class="text-xs text-zinc-400 mt-0.5"></p>
      </div>

      <div class="flex items-center gap-2">
        <button id="logoutBtn" class="text-xs text-zinc-400 hover:text-white px-2 py-1">Sign Out</button>

    </header>

    <!-- NAVIGATION TABS -->
    <nav class="flex gap-2 my-5">
      <button id="tabBoard" class="px-4 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-white border border-zinc-700">
        7-Day Board
      </button>
      <button id="tabVault" class="px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white border border-transparent">
        Closet Vault (<span id="vaultCount">0</span>)
      </button>
    </nav>

    <!-- VIEW 1: 7-DAY BOARD -->
    <section id="viewBoard" class="space-y-4">
      <div class="flex items-center justify-between bg-zinc-900/60 p-4 rounded-xl border border-zinc-800">
        <div>
          <h2 class="text-sm font-semibold text-white">Minnetonka, MN Forecast Sync</h2>
          <p class="text-xs text-zinc-400" id="forecastSummary">54°F High · Clear Autumn Skies</p>
        </div>
        <button id="curateWeekBtn" class="bg-brand-brass hover:bg-brand-brassLight text-zinc-950 font-semibold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 transition active:scale-95 shadow">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Curate Week with Sloane</span>
        </button>
      </div>

      <div id="daysGrid" class="grid grid-cols-1 md:grid-cols-5 gap-3">

      </div>
    </section>

    <!-- VIEW 2: CLOSET VAULT -->
    <section id="viewVault" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-zinc-300">Wardrobe Catalog</h2>
        <button id="addPieceBtn" class="bg-brand-brass hover:bg-brand-brassLight text-zinc-950 font-semibold text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow transition active:scale-95">
          <i data-lucide="camera" class="w-3.5 h-3.5"></i>
          <span>Add Piece</span>
        </button>
      </div>
      <div id="vaultGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- Injected via JavaScript -->
      </div>

  </div>

  <!-- NATIVE CAMERA FILE INPUT (Direct iOS Viewfinder Trigger) -->

  <!-- INTAKE & REVIEW DRAWER (Elena Tactile Architecture) -->
  <div id="intakeDrawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
    <div class="bg-zinc-900 border border-zinc-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl">
      
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-brand-brass animate-pulse"></div>
          <h3 class="text-sm font-bold text-white uppercase tracking-wider">Sloane Intake</h3>
        </div>
        <button id="closeIntakeBtn" class="text-zinc-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Preview & Vision Status -->
      <div class="relative aspect-video rounded-xl overflow-hidden bg-zinc-950 border border-zinc-800 flex items-center justify-center">
        <img id="intakePreview" class="w-full h-full object-cover hidden" alt="Garment Preview">
        <div id="intakeLoadingState" class="flex flex-col items-center gap-2 text-center p-4">
          <i data-lucide="loader-2" class="w-6 h-6 text-brand-brass animate-spin"></i>
          <p class="text-xs text-zinc-300 font-medium">Extracting Brand & Architecture...</p>
          <p class="text-[10px] text-zinc-500">Compressing flat-lay and querying Vision model</p>
        </div>
      </div>

      <!-- Editable Extracted Fields -->

          <div>

            <input type="text" id="intakeBrand" class="w-full px-3 py-1.5 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-white focus:outline-none focus:border-brand-brass">

        <div class="grid grid-cols-2 gap-2">

            <input type="text" id="intakeSubCategory" class="w-full px-3 py-1.5 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-white focus:outline-none focus:border-brand-brass">

          <select id="intakeFormality" class="w-full px-2.5 py-1.5 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-white focus:outline-none focus:border-brand-brass">

            <option value="Business Formal">Business Formal</option>
          </select>
        </div>

        <button id="commitPieceBtn" class="w-full py-2.5 bg-brand-brass hover:bg-brand-brassLight text-zinc-950 font-bold text-xs rounded-xl transition duration-150 flex items-center justify-center gap-1.5 active:scale-95 shadow">

  <!-- JAVASCRIPT ARCHITECTURE -->
  <script>
    (function() {
      const SUPABASE_URL = 'https://rqiuuzeatlhyxfgwvuaa.supabase.co';
      const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxaXV1emVhdGxoeXhmZ3d2dWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTU5ODEsImV4cCI6MjEwODEzMTk4MX0.X7-YIKjHCpoL2W_aEJVWOlr1UwGT_fawxiTqR-J4I0s';
      
      const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

      let currentUser = null;
      let garments = [];
      let activeAnchorGarmentId = null;
      let pendingIntakeBlob = null;
      let weeklyPlan = {};

      const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

      // 1. AUTHENTICATION LIFECYCLE
      async function initApp() {
        if (window.lucide) window.lucide.createIcons();
        if (!sb) {
          showAuthError("Database connection failed. Please check network settings.");
          return;
        }

        const { data: { session } } = await sb.auth.getSession();
        
        if (session) {
          handleUserSignedIn(session.user);
        } else {
          document.getElementById('authScreen').classList.remove('hidden');
        }

        sb.auth.onAuthStateChange((_event, session) => {
          if (session) {
            handleUserSignedIn(session.user);
          } else {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('appContainer').classList.add('hidden');
          }
        });
      }

      async function handleUserSignedIn(user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        document.getElementById('userEmailDisplay').textContent = user.email;

        await fetchUserData();
        curateBoard(); // Initial baseline curation
        renderVault();
        renderDaysBoard();
        if (window.lucide) window.lucide.createIcons();
      }

      function showAuthError(msg) {
        const errBox = document.getElementById('authError');
        errBox.textContent = msg;
        errBox.classList.remove('hidden');
      }

      // 2. FETCH GARMENTS
      async function fetchUserData() {
        const { data: gData } = await sb.from('garments').select('*').order('created_at', { ascending: false });
        garments = gData || [];
        document.getElementById('vaultCount').textContent = garments.length;
      }

      // 3. HERO ANCHOR ENGINE
      window.setHeroAnchor = function(garmentId) {
        activeAnchorGarmentId = (activeAnchorGarmentId === garmentId) ? null : garmentId;
        
        // Re-align Tuesday (today) around the anchor if set
        if (activeAnchorGarmentId) {
          curateBoard(1);
        }
        renderDaysBoard();
        renderVault();
      };

      // 4. SLOANE ALGORITHMIC CURATION ENGINE
      function curateBoard(dayIndex = null) {
        if (!garments || garments.length === 0) return;

        const tops = garments.filter(g => g.category === 'Top');
        const layers = garments.filter(g => g.category === 'Layer');
        const bottoms = garments.filter(g => g.category === 'Bottom');
        const footwear = garments.filter(g => g.category === 'Footwear');

        const getRandom = (arr) => arr.length > 0 ? arr[Math.floor(Math.random() * arr.length)] : null;

        const targetDays = dayIndex !== null ? [DAYS[dayIndex]] : DAYS;

        targetDays.forEach(day => {
          const isToday = (day === 'Tuesday');
          const anchor = (isToday && activeAnchorGarmentId) 
            ? garments.find(g => g.id === activeAnchorGarmentId) 
            : null;

          weeklyPlan[day] = {
            top: (anchor && anchor.category === 'Top') ? anchor : getRandom(tops),
            layer: (anchor && anchor.category === 'Layer') ? anchor : getRandom(layers),
            bottom: (anchor && anchor.category === 'Bottom') ? anchor : getRandom(bottoms),
            footwear: (anchor && anchor.category === 'Footwear') ? anchor : getRandom(footwear)
          };
        });

        renderDaysBoard();
      }

      window.recurateDay = function(dayIndex) {
        curateBoard(dayIndex);
      };

      // 5. RENDER 7-DAY BOARD
      function renderDaysBoard() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';

        DAYS.forEach((day, index) => {
          const isToday = index === 1;
          const col = document.createElement('div');
          col.className = 'bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex flex-col justify-between';

          const plan = weeklyPlan[day] || {};
          const topItem = plan.top;
          const layerItem = plan.layer;
          const bottomItem = plan.bottom;
          const footwearItem = plan.footwear;

          col.innerHTML = `
            <div class="flex items-center justify-between pb-2 border-b border-zinc-800/80 mb-2">
              <div>
                <span class="text-xs font-bold ${isToday ? 'text-brand-brass' : 'text-zinc-200'}">${day}</span>
                ${isToday ? '<span class="ml-1 text-[9px] bg-brand-brass/20 text-brand-brass px-1 rounded">TODAY</span>' : ''}
              </div>
              <span class="text-[10px] text-zinc-400">54°F High</span>
            </div>

            <div class="space-y-2 py-1">
              <div class="relative rounded-lg p-2 bg-zinc-950 border border-zinc-800 ${isToday && activeAnchorGarmentId && topItem && topItem.id === activeAnchorGarmentId ? 'hero-anchor-active' : ''}">
                <div class="flex items-center justify-between text-[10px] text-zinc-400 mb-0.5">
                  <span>Top</span>
                  ${isToday && activeAnchorGarmentId && topItem && topItem.id === activeAnchorGarmentId ? `
                    <span class="bg-brand-brass text-zinc-950 font-bold px-1.5 rounded text-[8px] tracking-wider">
                      ◈ HERO ANCHOR
                    </span>` : ''}
                </div>
                <p class="text-xs font-medium text-white truncate">${topItem ? topItem.name : 'Select Top'}</p>
                ${topItem && topItem.brand ? `<span class="text-[9px] text-zinc-500 block truncate">${topItem.brand}</span>` : ''}
              </div>

              <div class="relative rounded-lg p-2 bg-zinc-950 border border-zinc-800 ${isToday && activeAnchorGarmentId && layerItem && layerItem.id === activeAnchorGarmentId ? 'hero-anchor-active' : ''}">
                <div class="flex items-center justify-between text-[10px] text-zinc-400 mb-0.5">
                  <span>Layer</span>
                  ${isToday && activeAnchorGarmentId && layerItem && layerItem.id === activeAnchorGarmentId ? `
                    <span class="bg-brand-brass text-zinc-950 font-bold px-1.5 rounded text-[8px] tracking-wider">
                      ◈ HERO ANCHOR
                    </span>` : ''}
                </div>
                <p class="text-xs font-medium text-white truncate">${layerItem ? layerItem.name : 'Select Layer'}</p>
                ${layerItem && layerItem.brand ? `<span class="text-[9px] text-zinc-500 block truncate">${layerItem.brand}</span>` : ''}
              </div>

              <div class="relative rounded-lg p-2 bg-zinc-950 border border-zinc-800 ${isToday && activeAnchorGarmentId && bottomItem && bottomItem.id === activeAnchorGarmentId ? 'hero-anchor-active' : ''}">
                <div class="flex items-center justify-between text-[10px] text-zinc-400 mb-0.5">
                  <span>Bottom</span>
                  ${isToday && activeAnchorGarmentId && bottomItem && bottomItem.id === activeAnchorGarmentId ? `
                    <span class="bg-brand-brass text-zinc-950 font-bold px-1.5 rounded text-[8px] tracking-wider">
                      ◈ HERO ANCHOR
                    </span>` : ''}
                </div>
                <p class="text-xs font-medium text-white truncate">${bottomItem ? bottomItem.name : 'Select Bottom'}</p>
                ${bottomItem && bottomItem.brand ? `<span class="text-[9px] text-zinc-500 block truncate">${bottomItem.brand}</span>` : ''}
              </div>

              <div class="relative rounded-lg p-2 bg-zinc-950 border border-zinc-800 ${isToday && activeAnchorGarmentId && footwearItem && footwearItem.id === activeAnchorGarmentId ? 'hero-anchor-active' : ''}">
                <div class="flex items-center justify-between text-[10px] text-zinc-400 mb-0.5">
                  <span>Footwear</span>
                  ${isToday && activeAnchorGarmentId && footwearItem && footwearItem.id === activeAnchorGarmentId ? `
                    <span class="bg-brand-brass text-zinc-950 font-bold px-1.5 rounded text-[8px] tracking-wider">
                      ◈ HERO ANCHOR
                    </span>` : ''}
                </div>
                <p class="text-xs font-medium text-white truncate">${footwearItem ? footwearItem.name : 'Select Footwear'}</p>
                ${footwearItem && footwearItem.brand ? `<span class="text-[9px] text-zinc-500 block truncate">${footwearItem.brand}</span>` : ''}
              </div>
            </div>

            <div class="pt-2 mt-2 border-t border-zinc-800/80">
              <button onclick="recurateDay(${index})" class="w-full py-1 text-[11px] font-medium text-zinc-400 hover:text-brand-brass flex items-center justify-center gap-1 transition active:scale-95">
                <i data-lucide="rotate-cw" class="w-3 h-3"></i>
                <span>${isToday && activeAnchorGarmentId ? 'Style Around Anchor' : 'Re-Curate'}</span>
              </button>
            </div>
          `;
          grid.appendChild(col);
        });
        if (window.lucide) window.lucide.createIcons();
      }

      // 6. RENDER CLOSET VAULT (Lazy Loading Enabled)
      function renderVault() {
        const grid = document.getElementById('vaultGrid');
        grid.innerHTML = '';

        if (garments.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-12 text-center text-zinc-500 text-xs">
              No garments loaded. Tap "+ Add Piece" to snap your first item.
            </div>
          `;
          return;
        }

        garments.forEach(item => {
          const isAnchor = item.id === activeAnchorGarmentId;
          const card = document.createElement('div');
          card.className = `relative bg-zinc-900 border rounded-xl overflow-hidden p-2 flex flex-col justify-between transition ${isAnchor ? 'hero-anchor-active border-brand-brass' : 'border-zinc-800'}`;

          card.innerHTML = `
            <div class="aspect-square bg-zinc-950 rounded-lg overflow-hidden flex items-center justify-center relative mb-2">
              ${item.image_url ? 
                `<img src="${item.image_url}" 
                      loading="lazy" 
                      decoding="async"
                      alt="${item.name}" 
                      class="w-full h-full object-cover transition-opacity duration-300"
                      onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'flex items-center justify-center w-full h-full text-zinc-700\\'><i data-lucide=\\'shirt\\' class=\\'w-8 h-8\\'></i></div>'; lucide.createIcons();">` : 
                `<i data-lucide="shirt" class="w-8 h-8 text-zinc-600"></i>`}
              ${isAnchor ? `
                <div class="absolute top-1.5 right-1.5 bg-brand-brass text-zinc-950 text-[8px] font-bold px-1.5 py-0.5 rounded shadow">
                  ◈ HERO
                </div>` : ''}
            </div>
            <div>
              <div class="flex items-center justify-between">
                <span class="text-[10px] text-brand-brass uppercase font-semibold">${item.category}</span>
                ${item.brand ? `<span class="text-[9px] text-zinc-400 font-medium">${item.brand}</span>` : ''}
              </div>
              <p class="text-xs font-medium text-white truncate" title="${item.name}">${item.name}</p>
            </div>
            <button onclick="setHeroAnchor('${item.id}')" 
                    class="mt-2 w-full py-1 text-[10px] font-semibold rounded-lg border transition ${isAnchor ? 'bg-brand-brass text-zinc-950 border-brand-brass' : 'bg-zinc-800 text-zinc-300 border-zinc-700 hover:border-zinc-500'}">
              ${isAnchor ? 'Anchor Active' : 'Set as Hero Anchor'}
            </button>
          `;
          grid.appendChild(card);
        });
        if (window.lucide) window.lucide.createIcons();
      }

      // 7. CLIENT-SIDE COMPRESSOR (HTML5 Canvas downsampler)
      function compressImage(file, maxDimension = 1000, quality = 0.82) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > maxDimension) {
                  height = Math.round((height * maxDimension) / width);
                  width = maxDimension;
                }
              } else {
                if (height > maxDimension) {
                  width = Math.round((width * maxDimension) / height);
                  height = maxDimension;
                }
              }

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              const base64Data = canvas.toDataURL('image/jpeg', quality);
              canvas.toBlob((blob) => {
                resolve({ blob, base64Data });
              }, 'image/jpeg', quality);
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      // 8. FEAT-08: CAMERA INTAKE PIPELINE
      const addPieceBtn = document.getElementById('addPieceBtn');
      const cameraInput = document.getElementById('cameraInput');
      const intakeDrawer = document.getElementById('intakeDrawer');
      const closeIntakeBtn = document.getElementById('closeIntakeBtn');
      const intakePreview = document.getElementById('intakePreview');
      const intakeLoadingState = document.getElementById('intakeLoadingState');
      const intakeFields = document.getElementById('intakeFields');
      const commitPieceBtn = document.getElementById('commitPieceBtn');

      addPieceBtn.addEventListener('click', () => {
        cameraInput.value = '';
        cameraInput.click();
      });

      cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Open Drawer in Loading State
        intakeDrawer.classList.remove('hidden');
        intakePreview.classList.add('hidden');
        intakeLoadingState.classList.remove('hidden');
        intakeFields.classList.add('hidden');
        if (window.lucide) window.lucide.createIcons();

        try {
          // A. Local downsampling
          const { blob, base64Data } = await compressImage(file, 1000, 0.82);
          pendingIntakeBlob = blob;

          // Render Preview
          intakePreview.src = base64Data;
          intakePreview.classList.remove('hidden');

          // B. Dispatch to tag-garment Edge Function with detailed error catch
          const { data: tags, error } = await sb.functions.invoke('tag-garment', {
            body: { imageBase64: base64Data }
          });

          if (error) {
            let detail = error.message;
            try {
              if (error.context && typeof error.context.json === 'function') {
                const errBody = await error.context.json();
                if (errBody && errBody.error) detail = errBody.error;
              }
            } catch (_) {}
            throw new Error(detail);
          }

          // C. Pre-populate Review Drawer
          document.getElementById('intakeBrand').value = tags.brand || '';
          document.getElementById('intakeName').value = tags.name || file.name.replace(/\.[^/.]+$/, "");
          document.getElementById('intakeCategory').value = tags.category || 'Top';
          document.getElementById('intakeSubCategory').value = tags.sub_category || '';
          document.getElementById('intakeColor').value = tags.color || '';
          document.getElementById('intakeFormality').value = tags.formality || 'Executive Casual';

          intakeLoadingState.classList.add('hidden');
          intakeFields.classList.remove('hidden');
          if (window.lucide) window.lucide.createIcons();

        } catch (err) {
          console.error("Vision Tagging error:", err);
          alert("Auto-tagging notification: " + err.message + "\nYou can verify or enter the details manually.");
          intakeLoadingState.classList.add('hidden');
          intakeFields.classList.remove('hidden');
        }
      });

      closeIntakeBtn.addEventListener('click', () => {
        intakeDrawer.classList.add('hidden');
        pendingIntakeBlob = null;
      });

      // 9. SAVE PIECE TO SUPABASE CLOUD
      commitPieceBtn.addEventListener('click', async () => {
        if (!pendingIntakeBlob || !currentUser) return;

        commitPieceBtn.disabled = true;
        commitPieceBtn.textContent = 'Saving Piece to Vault...';

        try {
          const fileName = `${currentUser.id}/${Date.now()}_garment.jpg`;

          // A. Upload compressed photo to Supabase Storage
          const { error: uploadError } = await sb.storage
            .from('closet-images')
            .upload(fileName, pendingIntakeBlob, { contentType: 'image/jpeg' });

          if (uploadError) throw uploadError;

          // B. Get Public CDN URL
          const { data: { publicUrl } } = sb.storage
            .from('closet-images')
            .getPublicUrl(fileName);

          // C. Build Record
          const brandVal = document.getElementById('intakeBrand').value.trim();
          const record = {
            user_id: currentUser.id,
            name: document.getElementById('intakeName').value.trim() || 'Tailored Item',
            category: document.getElementById('intakeCategory').value,
            sub_category: document.getElementById('intakeSubCategory').value.trim(),
            brand: brandVal || null,
            color: document.getElementById('intakeColor').value.trim(),
            formality: document.getElementById('intakeFormality').value,
            season: ['Spring', 'Summer', 'Fall', 'Winter'],
            image_url: publicUrl,
            wear_count: 0
          };

          // D. Defensive DB Insert
          let { error: dbError } = await sb.from('garments').insert([record]);
          if (dbError && dbError.message.includes('brand')) {
            delete record.brand;
            record.notes = brandVal ? `Brand: ${brandVal}` : '';
            const retry = await sb.from('garments').insert([record]);
            dbError = retry.error;
          }

          if (dbError) throw dbError;

          // Close Drawer and Refresh Vault
          intakeDrawer.classList.add('hidden');
          pendingIntakeBlob = null;
          await fetchUserData();
          renderVault();

        } catch (err) {
          console.error("Save error:", err);
          alert("Error saving item: " + err.message);
        } finally {
          commitPieceBtn.disabled = false;
          commitPieceBtn.textContent = 'Save to Cloud Vault';
        }
      });

      // 10. EVENT LISTENERS
      document.getElementById('curateWeekBtn').addEventListener('click', () => {
        const btn = document.getElementById('curateWeekBtn');
        btn.classList.add('opacity-75');
        curateBoard();
        setTimeout(() => btn.classList.remove('opacity-75'), 200);
      });

      document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('authError');
        const noticeBox = document.getElementById('authNotice');
        const submitBtn = document.getElementById('authSubmitBtn');
        const emailInput = document.getElementById('authEmail');

        errBox.classList.add('hidden');
        noticeBox.classList.add('hidden');

        const email = emailInput.value.trim();
        if (!email) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending Magic Link...';

        try {
          const cleanRedirectUrl = window.location.origin + window.location.pathname;
          const { error } = await sb.auth.signInWithOtp({
            email: email,
            options: { emailRedirectTo: cleanRedirectUrl }
          });

          if (error) {
            showAuthError(error.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Magic Link';
          } else {
            noticeBox.textContent = '✓ Magic link sent! Please check your inbox.';
            noticeBox.classList.remove('hidden');
            submitBtn.textContent = 'Check Your Inbox';
          }
        } catch (err) {
          showAuthError("Connection error: " + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Magic Link';
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (sb) await sb.auth.signOut();
        window.location.reload();
      });

      document.getElementById('tabBoard').addEventListener('click', () => {
        document.getElementById('viewBoard').classList.remove('hidden');
        document.getElementById('viewVault').classList.add('hidden');
        document.getElementById('tabBoard').className = 'px-4 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-white border border-zinc-700';
        document.getElementById('tabVault').className = 'px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white border border-transparent';
      });

      document.getElementById('tabVault').addEventListener('click', () => {
        document.getElementById('viewVault').classList.remove('hidden');
        document.getElementById('viewBoard').classList.add('hidden');
        document.getElementById('tabVault').className = 'px-4 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-white border border-zinc-700';
        document.getElementById('tabBoard').className = 'px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white border border-transparent';
      });

      initApp();
    })();
  </script>
</body>
</html>
