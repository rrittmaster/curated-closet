<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Curated Closet</title>
  
  <!-- iOS PWA Standalone Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Curated Closet">
  <meta name="theme-color" content="#18181b">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              brass: '#C5B294',
              brassLight: '#DFD3C3',
              navy: '#0F172A',
              charcoal: '#1E293B',
              stone: '#27272A'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hero-anchor-active {
      border: 1.5px solid #C5B294 !important;
      box-shadow: 0 0 12px rgba(197, 178, 148, 0.25);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased pb-24">

  <!-- AUTH SCREEN (Shown if not logged in) -->
  <div id="authScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-950 px-4">
    <div class="w-full max-w-sm p-6 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl text-center">
      <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-zinc-800 flex items-center justify-center border border-zinc-700">
        <i data-lucide="sparkles" class="w-6 h-6 text-brand-brass"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white mb-1">Curated Closet</h1>
      <p class="text-xs text-zinc-400 mb-6">Executive Wardrobe Architecture</p>
      
      <form id="authForm" class="space-y-3">
        <input type="email" id="authEmail" required placeholder="Enter your work email" 
               class="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-sm focus:outline-none focus:border-brand-brass text-white placeholder-zinc-500">
        <button type="submit" id="authSubmitBtn" 
                class="w-full py-2.5 bg-brand-brass hover:bg-brand-brassLight text-zinc-950 font-medium text-sm rounded-xl transition duration-150">
          Send Magic Link
        </button>
      </form>
      <div id="authNotice" class="text-xs text-emerald-400 mt-4 hidden"></div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer" class="hidden max-w-5xl mx-auto px-4 pt-6">
    
    <!-- HEADER -->
    <header class="flex items-center justify-between pb-6 border-b border-zinc-800">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold text-white tracking-wide">CURATED CLOSET</h1>
          <span class="text-[10px] tracking-widest px-2 py-0.5 rounded-full bg-zinc-800 text-brand-brass uppercase font-semibold border border-zinc-700">
            Sloane Engine
          </span>
        </div>
        <p id="userEmailDisplay" class="text-xs text-zinc-400 mt-0.5"></p>
      </div>

      <div class="flex items-center gap-2">
        <!-- Migration Indicator -->
        <button id="migrateBtn" class="hidden text-xs bg-amber-500/10 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
          <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i>
          <span>Import 125 Items</span>
        </button>
        <button id="logoutBtn" class="text-xs text-zinc-400 hover:text-white px-2 py-1">Sign Out</button>
      </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="flex gap-2 my-5">
      <button id="tabBoard" class="px-4 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-white border border-zinc-700">
        7-Day Board
      </button>
      <button id="tabVault" class="px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white border border-transparent">
        Closet Vault (<span id="vaultCount">0</span>)
      </button>
    </nav>

    <!-- VIEW 1: 7-DAY BOARD -->
    <section id="viewBoard" class="space-y-4">
      <div class="flex items-center justify-between bg-zinc-900/60 p-4 rounded-xl border border-zinc-800">
        <div>
          <h2 class="text-sm font-semibold text-white">Minnetonka, MN Forecast Sync</h2>
          <p class="text-xs text-zinc-400" id="forecastSummary">Loading weather...</p>
        </div>
        <button id="curateWeekBtn" class="bg-brand-brass hover:bg-brand-brassLight text-zinc-950 font-semibold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 transition">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Curate Week with Sloane</span>
        </button>
      </div>

      <!-- Days Grid -->
      <div id="daysGrid" class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- VIEW 2: CLOSET VAULT -->
    <section id="viewVault" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-zinc-300">Wardrobe Catalog</h2>
        <button id="addItemBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Add Piece</span>
        </button>
      </div>
      <div id="vaultGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- Injected via JavaScript -->
      </div>
    </section>

  </div>

  <!-- JAVASCRIPT ARCHITECTURE -->
  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://rqiuuzeatlhyxfgwvuaa.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxaXV1emVhdGxoeXhmZ3d2dWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTU5ODEsImV4cCI6MjEwODEzMTk4MX0.X7-YIKjHCpoL2W_aEJVWOlr1UwGT_fawxiTqR-J4I0s';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let currentUser = null;
    let garments = [];
    let activeAnchorGarmentId = null; // FEAT-01 Hero Anchor
    let weeklyPlan = null;

    // Days structure
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

    // 1. AUTHENTICATION LIFECYCLE
    async function initApp() {
      lucide.createIcons();
      const { data: { session } } = await supabase.auth.getSession();
      
      if (session) {
        handleUserSignedIn(session.user);
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
      }

      supabase.auth.onAuthStateChange((_event, session) => {
        if (session) {
          handleUserSignedIn(session.user);
        } else {
          document.getElementById('authScreen').classList.remove('hidden');
          document.getElementById('appContainer').classList.add('hidden');
        }
      });
    }

    async function handleUserSignedIn(user) {
      currentUser = user;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('userEmailDisplay').textContent = user.email;

      // Check for local legacy migration
      checkLegacyMigrationNeeded();

      // Fetch user data from Supabase
      await fetchUserData();
      renderVault();
      renderDaysBoard();
      lucide.createIcons();
    }

    // 2. ONE-CLICK LOCALSTORAGE MIGRATION (FEAT-03)
    function checkLegacyMigrationNeeded() {
      const localData = localStorage.getItem('curated_closet_vault') || localStorage.getItem('confirmedGarments');
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const migrateBtn = document.getElementById('migrateBtn');
            migrateBtn.classList.remove('hidden');
            migrateBtn.onclick = () => runMigration(parsed);
          }
        } catch(e) { console.error("Migration parse check failed", e); }
      }
    }

    async function runMigration(localItems) {
      const migrateBtn = document.getElementById('migrateBtn');
      migrateBtn.innerHTML = `<span>Importing...</span>`;

      const rowsToInsert = localItems.map(item => ({
        user_id: currentUser.id,
        name: item.name || 'Tailored Item',
        category: item.category || 'Tops',
        sub_category: item.subCategory || item.category,
        color: item.color || '',
        pattern: item.pattern || '',
        formality: item.formality || 'Executive Casual',
        season: item.season || ['All'],
        image_url: item.imageUrl || item.image || '',
        wear_count: item.wearCount || 0
      }));

      const { data, error } = await supabase.from('garments').insert(rowsToInsert);
      if (!error) {
        localStorage.removeItem('curated_closet_vault');
        localStorage.removeItem('confirmedGarments');
        migrateBtn.classList.add('hidden');
        await fetchUserData();
        renderVault();
        alert('All 125 pieces successfully imported to your private cloud closet!');
      } else {
        alert('Import failed: ' + error.message);
        migrateBtn.textContent = 'Retry Import';
      }
    }

    // 3. FETCH GARMENTS & PLANS
    async function fetchUserData() {
      const { data: gData } = await supabase.from('garments').select('*').order('created_at', { ascending: false });
      garments = gData || [];
      document.getElementById('vaultCount').textContent = garments.length;

      const { data: pData } = await supabase.from('weekly_plans').select('*').order('created_at', { ascending: false }).limit(1);
      weeklyPlan = pData && pData[0] ? pData[0].plan_data : null;
    }

    // 4. FEAT-01: HERO PIECE STYLING ENGINE
    window.setHeroAnchor = function(garmentId) {
      if (activeAnchorGarmentId === garmentId) {
        activeAnchorGarmentId = null; // Toggle off
      } else {
        activeAnchorGarmentId = garmentId;
      }
      renderDaysBoard();
      renderVault();
    };

    // 5. RENDER 7-DAY BOARD
    function renderDaysBoard() {
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      DAYS.forEach((day, index) => {
        const isToday = index === 1; // Tuesday demo default
        const col = document.createElement('div');
        col.className = 'bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex flex-col justify-between';

        const anchorGarment = garments.find(g => g.id === activeAnchorGarmentId);

        col.innerHTML = `
          <div class="flex items-center justify-between pb-2 border-b border-zinc-800/80 mb-2">
            <div>
              <span class="text-xs font-bold ${isToday ? 'text-brand-brass' : 'text-zinc-200'}">${day}</span>
              ${isToday ? '<span class="ml-1 text-[9px] bg-brand-brass/20 text-brand-brass px-1 rounded">TODAY</span>' : ''}
            </div>
            <span class="text-[10px] text-zinc-400">54°F High</span>
          </div>

          <div class="space-y-2 py-1">
            <!-- SLOT: TOP / ANCHOR -->
            <div class="relative rounded-lg p-2 bg-zinc-950 border border-zinc-800 ${isToday && activeAnchorGarmentId ? 'hero-anchor-active' : ''}">
              <div class="flex items-center justify-between text-[10px] text-zinc-400 mb-1">
                <span>Top</span>
                ${isToday && activeAnchorGarmentId ? `
                  <span class="bg-brand-brass text-zinc-950 font-bold px-1.5 py-0.2 rounded text-[8px] tracking-wider">
                    ◈ HERO ANCHOR
                  </span>` : ''}
              </div>
              <p class="text-xs font-medium text-white truncate">
                ${isToday && anchorGarment ? anchorGarment.name : 'Oxford Shirt'}
              </p>
            </div>

            <!-- SLOT: LAYER -->
            <div class="rounded-lg p-2 bg-zinc-950 border border-zinc-800">
              <span class="text-[10px] text-zinc-400 block mb-1">Layer</span>
              <p class="text-xs font-medium text-white truncate">Khaki Utility Field Jacket</p>
            </div>

            <!-- SLOT: BOTTOM -->
            <div class="rounded-lg p-2 bg-zinc-950 border border-zinc-800">
              <span class="text-[10px] text-zinc-400 block mb-1">Bottom</span>
              <p class="text-xs font-medium text-white truncate">Charcoal 5-Pocket Trousers</p>
            </div>

            <!-- SLOT: FOOTWEAR -->
            <div class="rounded-lg p-2 bg-zinc-950 border border-zinc-800">
              <span class="text-[10px] text-zinc-400 block mb-1">Footwear</span>
              <p class="text-xs font-medium text-white truncate">KOIO Capri White</p>
            </div>
          </div>

          <div class="pt-2 mt-2 border-t border-zinc-800/80">
            <button class="w-full py-1 text-[11px] font-medium text-zinc-400 hover:text-brand-brass flex items-center justify-center gap-1 transition">
              <i data-lucide="rotate-cw" class="w-3 h-3"></i>
              <span>${isToday && activeAnchorGarmentId ? 'Style Around Anchor' : 'Re-Curate'}</span>
            </button>
          </div>
        `;
        grid.appendChild(col);
      });
      lucide.createIcons();
    }

    // 6. RENDER CLOSET VAULT
    function renderVault() {
      const grid = document.getElementById('vaultGrid');
      grid.innerHTML = '';

      garments.forEach(item => {
        const isAnchor = item.id === activeAnchorGarmentId;
        const card = document.createElement('div');
        card.className = `relative bg-zinc-900 border rounded-xl overflow-hidden p-2 flex flex-col justify-between transition ${isAnchor ? 'hero-anchor-active border-brand-brass' : 'border-zinc-800'}`;

        card.innerHTML = `
          <div class="aspect-square bg-zinc-950 rounded-lg overflow-hidden flex items-center justify-center relative mb-2">
            ${item.image_url ? 
              `<img src="${item.image_url}" class="w-full h-full object-cover">` : 
              `<i data-lucide="shirt" class="w-8 h-8 text-zinc-600"></i>`}
            ${isAnchor ? `
              <div class="absolute top-1.5 right-1.5 bg-brand-brass text-zinc-950 text-[8px] font-bold px-1.5 py-0.5 rounded shadow">
                ◈ HERO
              </div>` : ''}
          </div>
          <div>
            <span class="text-[10px] text-brand-brass uppercase font-semibold">${item.category}</span>
            <p class="text-xs font-medium text-white truncate">${item.name}</p>
          </div>
          <button onclick="setHeroAnchor('${item.id}')" 
                  class="mt-2 w-full py-1 text-[10px] font-semibold rounded-lg border transition ${isAnchor ? 'bg-brand-brass text-zinc-950 border-brand-brass' : 'bg-zinc-800 text-zinc-300 border-zinc-700 hover:border-zinc-500'}">
            ${isAnchor ? 'Anchor Active' : 'Set as Hero Anchor'}
          </button>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    // EVENT LISTENERS
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const submitBtn = document.getElementById('authSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.href }
      });

      if (!error) {
        document.getElementById('authNotice').textContent = 'Magic link sent! Check your inbox.';
        document.getElementById('authNotice').classList.remove('hidden');
      } else {
        alert('Auth error: ' + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Magic Link';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.reload();
    });

    // Tab Switchers
    document.getElementById('tabBoard').addEventListener('click', () => {
      document.getElementById('viewBoard').classList.remove('hidden');
      document.getElementById('viewVault').classList.add('hidden');
      document.getElementById('tabBoard').className = 'px-4 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-white border border-zinc-700';
      document.getElementById('tabVault').className = 'px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white border border-transparent';
    });

    document.getElementById('tabVault').addEventListener('click', () => {
      document.getElementById('viewVault').classList.remove('hidden');
      document.getElementById('viewBoard').classList.add('hidden');
      document.getElementById('tabVault').className = 'px-4 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-white border border-zinc-700';
      document.getElementById('tabBoard').className = 'px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white border border-transparent';
    });

    // Initialize on load
    initApp();
  </script>
</body>
</html>
