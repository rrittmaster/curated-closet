<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Curated Closet · Sloane Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0d0e11;
      --card-bg: #15171c;
      --card-border: #222630;
      --row-bg: #101217;
      --accent: #c49d64; /* Sartorial Warm Cognac */
      --accent-dim: rgba(196, 157, 100, 0.12);
      --text: #f3f4f6;
      --text-muted: #8b92a0;
      --pill-bg: #1d212a;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 80px) 16px;
      line-height: 1.5;
    }

    header {
      padding: 16px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 24px;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    .brand-subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-top: 2px;
    }

    /* Fixed Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(13, 14, 17, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      z-index: 999;
    }
    .nav-btn {
      flex: 1;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--accent);
    }

    /* Subbar / Location Pill */
    .board-subbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
    }
    .location-pill {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .location-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Sloane Briefing Card */
    .briefing-card {
      background: linear-gradient(145deg, #181b22, #121419);
      border: 1px solid rgba(196, 157, 100, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .briefing-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .briefing-text {
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 1.6;
      color: #e5e7eb;
      font-style: italic;
    }

    /* Primary Action */
    .btn-curate {
      width: 100%;
      background: var(--accent);
      color: #0b0c0e;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 20px;
      transition: opacity 0.2s;
    }
    .btn-curate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .engine-notice {
      background: #1f1a14;
      border: 1px solid #4a3820;
      color: #e2ba7d;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    /* YNAB-Style Day Card */
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .day-card-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid #20242e;
      padding-bottom: 14px;
      margin-bottom: 12px;
    }
    .day-card-row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .day-heading-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .day-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .day-date {
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
    }
    .day-weather-badge {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--pill-bg);
      padding: 4px 10px;
      border-radius: 14px;
      border: 1px solid #232730;
      white-space: nowrap;
    }
    .day-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .day-recurate-btn {
      background: var(--pill-bg);
      border: 1px solid #232730;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
    }
    .day-recurate-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .day-card.is-recurating .day-recurate-btn {
      animation: recurate-spin 0.9s linear infinite;
      opacity: 1;
    }
    .day-card.is-recurating .attire-rows-list,
    .day-card.is-recurating .day-rationale {
      opacity: 0.45;
      transition: opacity 0.2s;
    }
    @keyframes recurate-spin {
      to { transform: rotate(360deg); }
    }
    .activity-selector {
      width: 100%;
      background: #101216;
      border: 1px solid #232730;
      color: var(--text);
      font-size: 16px; /* Prevents iOS auto-zoom */
      padding: 9px 12px;
      border-radius: 8px;
      outline: none;
    }

    /* YNAB-Style Attire Rows */
    .attire-rows-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .attire-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--row-bg);
      border: 1px solid #1c2028;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .attire-thumb-container {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: #1a1e26;
      border: 1px solid #262c38;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .attire-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .attire-thumb-fallback {
      font-size: 18px;
      opacity: 0.6;
    }
    .attire-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .attire-meta-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .attire-slot-pill {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--accent);
      background: rgba(196, 157, 100, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .attire-brand {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .attire-item-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-rationale {
      font-size: 13px;
      color: #9ca3af;
      font-style: italic;
      border-left: 2px solid var(--accent);
      padding-left: 10px;
      margin-top: 8px;
      line-height: 1.5;
    }

    /* Wardrobe Grid with Images */
    .wardrobe-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .garment-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .garment-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #121419;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    .garment-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .garment-img-fallback {
      font-size: 32px;
      opacity: 0.4;
    }
    .garment-details {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .garment-brand {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
    }
    .garment-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      color: #ffffff;
    }
    .garment-meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .anchor-btn {
      margin-top: auto;
      background: #1a1e26;
      border: 1px solid #2a303c;
      color: #cbd5e1;
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .anchor-btn.locked {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }

    /* Modals & Lightbox */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: flex-end;
      z-index: 1000;
    }
    .modal-sheet {
      background: #16181f;
      border-top: 1px solid #2a303c;
      width: 100%;
      border-radius: 16px 16px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)) 16px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title {
      font-family: var(--font-serif);
      font-size: 18px;
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: #0f1014;
      border: 1px solid #262a34;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 16px; /* Prevents iOS auto-zoom */
    }

    /* Lightbox Modal */
    #image-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }
    #image-lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 12px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">Curated Closet</div>
      <div class="brand-subtitle">Sloane Styling Engine</div>
    </div>
  </header>

  <!-- TAB 1: 7-DAY BOARD -->
  <main id="tab-board">
    <div class="board-subbar">
      <button class="location-pill" onclick="promptChangeLocation()">
        📍 <span id="location-pill-label">Minnetonka, MN</span> ▾
      </button>
      <span class="location-hint">Tap city to edit</span>
    </div>

    <div id="engine-notice-bar" class="engine-notice"></div>

    <div id="briefing-box" class="briefing-card" style="display:none;">
      <div class="briefing-header">Sloane Sartorial Direction</div>
      <div id="briefing-text-content" class="briefing-text"></div>
    </div>

    <button id="curate-button" class="btn-curate" onclick="invokeSloaneCuration()">
      Curate Week with Sloane
    </button>

    <div id="board-cards-container">
      <!-- Monday through Friday cards render dynamically -->
    </div>
  </main>

  <!-- TAB 2: WARDROBE (Formerly Closet Vault) -->
  <main id="tab-wardrobe" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div>
        <h2 style="font-size:18px; font-weight:600;">Wardrobe</h2>
        <p style="font-size:13px; color:var(--text-muted);" id="wardrobe-count">0 Garments Indexed</p>
      </div>
      <button onclick="openAddModal()" style="background:var(--accent); color:#000; border:none; padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;">
        + Add Piece
      </button>
    </div>

    <div id="wardrobe-grid" class="wardrobe-grid">
      <!-- Catalog items with images render dynamically -->
    </div>
  </main>

  <!-- ADD PIECE / VISION MODAL -->
  <div id="add-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 class="modal-title">Intake Garment</h3>
        <button onclick="closeAddModal()" style="background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;">✕</button>
      </div>

      <div class="form-group">
        <label>Flat-Lay Camera / Photo Snap</label>
        <input type="file" id="camera-file-input" accept="image/*" capture="environment" onchange="handleImageIntake(event)">
      </div>

      <div id="vision-status" style="font-size:12px; color:var(--accent); margin-bottom:12px; display:none;">
        Analyzing garment geometry and fabric signatures...
      </div>

      <div class="form-group">
        <label>Brand / Label</label>
        <input type="text" id="piece-brand" placeholder="e.g. Vuori, Relwen, Peter Millar">
      </div>

      <div class="form-group">
        <label>Garment Name</label>
        <input type="text" id="piece-name" placeholder="e.g. Oatmeal Herringbone Sport Coat">
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="piece-category">
          <option value="Top">Top</option>
          <option value="Layer">Layer</option>
          <option value="Bottom">Bottom</option>
          <option value="Footwear">Footwear</option>
        </select>
      </div>

      <div class="form-group">
        <label>Sub-Category</label>
        <input type="text" id="piece-subcategory" placeholder="e.g. Oxford, Knit, Chino, Sneaker">
      </div>

      <div class="form-group">
        <label>Color</label>
        <input type="text" id="piece-color" placeholder="e.g. Navy, Tobacco, Charcoal">
      </div>

      <div class="form-group">
        <label>Formality</label>
        <select id="piece-formality">
          <option value="Executive Casual">Executive Casual</option>
          <option value="Casual">Casual</option>
          <option value="Business Formal">Business Formal</option>
        </select>
      </div>

      <button onclick="saveGarment()" style="width:100%; background:var(--accent); color:#000; border:none; padding:13px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; margin-top:8px;">
        Save to Wardrobe
      </button>
    </div>
  </div>

  <!-- LIGHTBOX MODAL -->
  <div id="image-lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Garment Preview">
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="nav-bar">
    <button class="nav-btn active" id="btn-nav-board" onclick="switchTab('board')">
      <span style="font-size:18px;">🗓️</span>
      <span>7-Day Board</span>
    </button>
    <button class="nav-btn" id="btn-nav-wardrobe" onclick="switchTab('wardrobe')">
      <span style="font-size:18px;">👔</span>
      <span>Wardrobe</span>
    </button>
  </nav>

  <script>
    // --- 1. SUPABASE CLIENT & STATE ---
    const SUPABASE_URL = "https://rqiuuzeatlhyxfgwvuaa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxaXV1emVhdGxoeXhmZ3d2dWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTU5ODEsImV4cCI6MjEwODEzMTk4MX0.X7-YIKjHCpoL2W_aEJVWOlr1UwGT_fawxiTqR-J4I0s";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const WORKWEEK_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const DEFAULT_LOCATION = { name: "Minnetonka, MN", lat: 44.9133, lon: -93.4708 };

    let wardrobe = [];
    let currentCuration = null;
    let heroAnchor = null;
    let currentLocation = JSON.parse(localStorage.getItem("curated_closet_location")) || DEFAULT_LOCATION;
    let dailyWeatherMap = {};
    let currentPhotoBase64 = null;
    let dailyActivities = JSON.parse(localStorage.getItem("curated_closet_activities")) || {
      Monday: "Executive Casual / Office",
      Tuesday: "In-Person Meeting",
      Wednesday: "Work From Home / Focus",
      Thursday: "Executive Casual / Office",
      Friday: "Client Dinner / Evening"
    };

    // --- 2. WORKWEEK CALENDAR DATES & ISO DATE MAPPER ---
    let workweekISODates = {};
    function getWorkweekDates() {
      const dates = {};
      workweekISODates = {};
      const now = new Date();
      const currentDayOfWeek = now.getDay();
      
      // Friday after 17:00, Saturday, and Sunday plan the upcoming workweek
      let distanceToMonday;
      if (currentDayOfWeek === 0) {
        distanceToMonday = 1;
      } else if (currentDayOfWeek === 6) {
        distanceToMonday = 2;
      } else if (currentDayOfWeek === 5 && now.getHours() >= 17) {
        distanceToMonday = 3;
      } else {
        distanceToMonday = 1 - currentDayOfWeek;
      }
      const mondayDate = new Date(now);
      mondayDate.setDate(now.getDate() + distanceToMonday);

      WORKWEEK_DAYS.forEach((day, index) => {
        const d = new Date(mondayDate);
        d.setDate(mondayDate.getDate() + index);
        
        dates[day] = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const dayNum = String(d.getDate()).padStart(2, '0');
        workweekISODates[day] = `${year}-${month}-${dayNum}`;
      });
      return dates;
    }
    const workweekDates = getWorkweekDates();

    // --- 3. WEATHER SUBSYSTEM (ACCURATE DATE MAPPING) ---
    function parseWeatherCode(code) {
      if (code === 0) return "Clear";
      if (code <= 3) return "Partly Cloudy";
      if (code <= 48) return "Fog";
      if (code <= 67) return "Rain/Showers";
      if (code <= 77) return "Snow";
      return "Overcast";
    }

    async function fetchForecast(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=8`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.daily && data.daily.time) {
          const forecastByDate = {};
          data.daily.time.forEach((dateStr, idx) => {
            const max = Math.round(data.daily.temperature_2m_max[idx]);
            const min = Math.round(data.daily.temperature_2m_min[idx]);
            const cond = parseWeatherCode(data.daily.weathercode[idx]);
            forecastByDate[dateStr] = { max, min, cond, summary: `${max}°F / ${min}°F · ${cond}` };
          });

          WORKWEEK_DAYS.forEach(day => {
            const iso = workweekISODates[day];
            if (forecastByDate[iso]) {
              dailyWeatherMap[day] = forecastByDate[iso];
            } else {
              dailyWeatherMap[day] = { max: 62, min: 45, cond: "Clear", summary: "62°F / 45°F · Clear" };
            }
          });
          renderBoard();
        }
      } catch (err) {
        console.warn("Weather fetch fallback:", err);
      }
    }

    async function promptChangeLocation() {
      const input = prompt("Enter city name or zip code:", currentLocation.name);
      if (!input || !input.trim()) return;

      try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(input.trim())}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();
        if (geoData.results && geoData.results.length > 0) {
          const match = geoData.results[0];
          currentLocation = {
            name: `${match.name}, ${match.admin1_code || match.country_code}`,
            lat: match.latitude,
            lon: match.longitude
          };
          localStorage.setItem("curated_closet_location", JSON.stringify(currentLocation));
          document.getElementById("location-pill-label").innerText = currentLocation.name;
          await fetchForecast(currentLocation.lat, currentLocation.lon);
        } else {
          alert("City not found. Please try another search.");
        }
      } catch (err) {
        alert("Location lookup error: " + err.message);
      }
    }

    function setDayActivity(day, activity) {
      dailyActivities[day] = activity;
      localStorage.setItem("curated_closet_activities", JSON.stringify(dailyActivities));
      if (currentCuration?.days) recurateDay(day);
    }

    // --- 4. WARDROBE LOADER & VISUAL GRID ---
    async function loadWardrobe() {
      try {
        let { data, error } = await supabaseClient.from("garments").select("*").order("created_at", { ascending: false });

        if (error || !data || data.length === 0) {
          const session = (await supabaseClient.auth.getSession())?.data?.session;
          if (session) {
            const res = await supabaseClient.from("garments").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false });
            data = res.data;
          }
        }

        wardrobe = data || [];
        document.getElementById("wardrobe-count").innerText = `${wardrobe.length} Garments Indexed`;
        renderWardrobe();
        renderBoard();
      } catch (err) {
        console.error("Failed to load wardrobe:", err);
      }
    }

    function renderWardrobe() {
      const container = document.getElementById("wardrobe-grid");
      if (!container) return;
      if (wardrobe.length === 0) {
        container.innerHTML = `<p style="grid-column:span 2; font-size:13px; color:var(--text-muted); text-align:center; padding:24px;">Wardrobe empty. Tap + Add Piece to index your attire.</p>`;
        return;
      }

      const fallbackIcon = {
        Top: "👔",
        Layer: "🧥",
        Bottom: "👖",
        Footwear: "👞"
      };

      container.innerHTML = wardrobe.map(g => {
        const hasImg = Boolean(g.image_url || g.image_base64);
        const imgSrc = g.image_url || g.image_base64 || "";
        const icon = fallbackIcon[g.category] || "✨";

        return `
          <div class="garment-card">
            <div class="garment-img-box" onclick="${hasImg ? `openLightbox('${imgSrc}')` : ''}">
              ${hasImg 
                ? `<img class="garment-img" src="${imgSrc}" alt="${g.name}">` 
                : `<span class="garment-img-fallback">${icon}</span>`}
            </div>
            <div class="garment-details">
              <div class="garment-brand">${g.brand || 'Unbranded'}</div>
              <div class="garment-name">${g.name}</div>
              <div class="garment-meta">${g.category} · ${g.color || ''}</div>
              <div class="garment-meta" style="font-size:11px; color:#6b7280;">${g.formality || 'Executive Casual'}</div>
              <button class="anchor-btn ${heroAnchor?.garmentId === g.id ? 'locked' : ''}" onclick="toggleAnchor('${g.id}')">
                ${heroAnchor?.garmentId === g.id ? '⚓ Locked as Anchor' : 'Set as Anchor'}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function toggleAnchor(garmentId) {
      if (heroAnchor?.garmentId === garmentId) {
        heroAnchor = null;
      } else {
        const targetDay = prompt("Assign this anchor to which day? (Monday, Tuesday, Wednesday, Thursday, Friday):", "Tuesday");
        if (WORKWEEK_DAYS.includes(targetDay)) {
          heroAnchor = { day: targetDay, garmentId: garmentId };
        }
      }
      renderWardrobe();
    }

    // --- 5. YNAB-STYLE BOARD RENDERING WITH THUMBNAILS ---
    function renderAttireRow(slotName, item) {
      const fallbackIcon = {
        Top: "👔",
        Layer: "🧥",
        Bottom: "👖",
        Footwear: "👞"
      }[slotName] || "✨";

      const hasImage = item && (item.image_url || item.image_base64);
      const imgSrc = item?.image_url || item?.image_base64 || "";

      return `
        <div class="attire-row">
          <div class="attire-thumb-container" onclick="${hasImage ? `openLightbox('${imgSrc}')` : ''}">
            ${hasImage 
              ? `<img class="attire-thumb" src="${imgSrc}" alt="${item.name}">` 
              : `<span class="attire-thumb-fallback">${fallbackIcon}</span>`}
          </div>
          <div class="attire-info">
            <div class="attire-meta-top">
              <span class="attire-slot-pill">${slotName}</span>
              ${item?.brand ? `<span class="attire-brand">${item.brand}</span>` : ''}
            </div>
            <div class="attire-item-name">${item ? item.name : '—'}</div>
          </div>
        </div>
      `;
    }

    function renderBoard() {
      const container = document.getElementById("board-cards-container");
      if (!container) return;

      container.innerHTML = WORKWEEK_DAYS.map(renderDayCard).join("");
    }

    // Swaps in a fresh card for one day, leaving the other cards untouched
    function replaceDayCard(day) {
      const card = document.getElementById(`day-card-${day}`);
      if (card) card.outerHTML = renderDayCard(day);
    }

    function renderDayCard(day) {
        const dayPlan = currentCuration?.days?.[day];
        const findGarment = (id) => (id ? wardrobe.find(g => String(g.id) === String(id)) : undefined);
        const topItem = findGarment(dayPlan?.top_id);
        const layerItem = findGarment(dayPlan?.layer_id);
        const bottomItem = findGarment(dayPlan?.bottom_id);
        const footItem = findGarment(dayPlan?.footwear_id);

        const weatherText = dailyWeatherMap[day]?.summary || "Syncing weather...";
        const currentActivity = dailyActivities[day] || "Executive Casual / Office";
        const dateLabel = workweekDates[day] || "";
        const isRecurating = recuratingDays.has(day);
        const canRecurate = Boolean(currentCuration?.days) && !isRecurating;

        return `
          <div class="day-card${isRecurating ? ' is-recurating' : ''}" id="day-card-${day}">
            <div class="day-card-header">
              <div class="day-card-row1">
                <div class="day-heading-group">
                  <span class="day-name">${day}</span>
                  <span class="day-date">${dateLabel}</span>
                </div>
                <div class="day-card-actions">
                  <span class="day-weather-badge">${weatherText}</span>
                  <button class="day-recurate-btn" onclick="recurateDay('${day}')" title="Re-curate ${day}" ${canRecurate ? '' : 'disabled'}>↻</button>
                </div>
              </div>
              <select class="activity-selector" onchange="setDayActivity('${day}', this.value)">
                <option value="Executive Casual / Office" ${currentActivity === 'Executive Casual / Office' ? 'selected' : ''}>Executive Casual / Office</option>
                <option value="In-Person Meeting" ${currentActivity === 'In-Person Meeting' ? 'selected' : ''}>In-Person Meeting (Formal)</option>
                <option value="Work From Home / Focus" ${currentActivity === 'Work From Home / Focus' ? 'selected' : ''}>Work From Home / Focus</option>
                <option value="Client Dinner / Evening" ${currentActivity === 'Client Dinner / Evening' ? 'selected' : ''}>Client Dinner / Evening</option>
                <option value="Travel / Transit" ${currentActivity === 'Travel / Transit' ? 'selected' : ''}>Travel / Transit</option>
              </select>
            </div>

            <div class="attire-rows-list">
              ${renderAttireRow("Top", topItem)}
              ${renderAttireRow("Layer", layerItem)}
              ${renderAttireRow("Bottom", bottomItem)}
              ${renderAttireRow("Footwear", footItem)}
            </div>

            ${dayPlan?.rationale ? `<div class="day-rationale">“${dayPlan.rationale}”</div>` : ''}
          </div>
        `;
    }

    // Parses the curate-week response defensively: strips markdown fences and
    // replaces raw control characters before JSON.parse, and reports non-JSON
    // responses (e.g. gateway timeouts) with their HTTP status
    function parseCurationResponse(text, status) {
      const cleaned = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
      try {
        return JSON.parse(cleaned);
      } catch (err) {
        try {
          return JSON.parse(cleaned.replace(/[\u0000-\u001F]+/g, " "));
        } catch (_) {
          throw new Error(`Unreadable curation response (HTTP ${status}): ${cleaned.slice(0, 120) || err.message}`);
        }
      }
    }

    // Persists the curation with the Monday it was built for, so a stored board
    // is discarded once the calendar rolls to a new workweek
    const CURATION_STORAGE_KEY = "curated_closet_weekly_curation";

    function saveCuration() {
      localStorage.setItem(CURATION_STORAGE_KEY, JSON.stringify({
        weekStart: workweekISODates.Monday,
        curation: currentCuration
      }));
    }

    function restoreCuration() {
      try {
        const stored = JSON.parse(localStorage.getItem(CURATION_STORAGE_KEY));
        if (stored?.curation?.days && stored.weekStart === workweekISODates.Monday) {
          currentCuration = stored.curation;
          showBriefing(currentCuration.executiveBriefing);
        } else if (stored) {
          localStorage.removeItem(CURATION_STORAGE_KEY);
        }
      } catch (err) {
        localStorage.removeItem(CURATION_STORAGE_KEY);
      }
    }

    function showBriefing(text) {
      if (!text) return;
      document.getElementById("briefing-box").style.display = "block";
      document.getElementById("briefing-text-content").innerText = `"${text}"`;
    }

    async function requestCuration(extraBody) {
      const dailySchedules = {};
      WORKWEEK_DAYS.forEach(day => {
        dailySchedules[day] = {
          weather: dailyWeatherMap[day]?.summary || "54°F · Clear",
          activity: dailyActivities[day] || "Executive Casual / Office"
        };
      });

      const res = await fetch(`${SUPABASE_URL}/functions/v1/curate-week`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY
        },
        body: JSON.stringify({
          locationName: currentLocation.name,
          garments: wardrobe,
          heroAnchor: heroAnchor,
          dailySchedules: dailySchedules,
          ...extraBody
        })
      });

      const data = parseCurationResponse(await res.text(), res.status);
      if (data.error) throw new Error(data.error);
      return data;
    }

    // Re-curates a single day against the other four locked days. Results are
    // dropped if a newer request for that day, or a full-week curation, landed first
    let curationVersion = 0;
    const recuratingDays = new Set();
    const dayRequestSeq = {};

    async function recurateDay(day) {
      if (!currentCuration?.days) return;

      const noticeBar = document.getElementById("engine-notice-bar");
      noticeBar.style.display = "none";

      const seq = (dayRequestSeq[day] || 0) + 1;
      dayRequestSeq[day] = seq;
      const versionAtStart = curationVersion;

      const lockedOutfits = {};
      WORKWEEK_DAYS.filter(d => d !== day).forEach(d => {
        const plan = currentCuration.days[d];
        if (plan) {
          lockedOutfits[d] = {
            top_id: plan.top_id,
            layer_id: plan.layer_id,
            bottom_id: plan.bottom_id,
            footwear_id: plan.footwear_id
          };
        }
      });

      const current = currentCuration.days[day];
      const previousOutfit = current ? {
        top_id: current.top_id,
        layer_id: current.layer_id,
        bottom_id: current.bottom_id,
        footwear_id: current.footwear_id
      } : null;

      recuratingDays.add(day);
      replaceDayCard(day);

      try {
        console.log(`[recurate] ${day} → sending previous_outfit`, previousOutfit, "activity:", dailyActivities[day]);
        const data = await requestCuration({
          target_day: day,
          locked_outfits: lockedOutfits,
          previous_outfit: previousOutfit
        });
        console.log(`[recurate] ${day} ← received`, data.day);
        if (dayRequestSeq[day] !== seq || curationVersion !== versionAtStart) {
          console.log(`[recurate] ${day} result discarded (superseded by a newer request)`);
          return;
        }
        if (!data.day) throw new Error("No outfit returned for this day. Is the latest curate-week deployed?");
        currentCuration.days[day] = data.day;
        saveCuration();
        console.log(`[recurate] ${day} state updated; re-rendering card`);
      } catch (err) {
        if (dayRequestSeq[day] !== seq) return;
        console.error(`Re-curation failure (${day}):`, err);
        noticeBar.style.display = "block";
        noticeBar.innerText = `Sloane engine notice (${day}): ` + err.message;
      } finally {
        if (dayRequestSeq[day] === seq) {
          recuratingDays.delete(day);
          replaceDayCard(day);
        }
      }
    }

    async function invokeSloaneCuration() {
      const btn = document.getElementById("curate-button");
      const noticeBar = document.getElementById("engine-notice-bar");
      noticeBar.style.display = "none";

      if (wardrobe.length < 5) {
        alert("Please add at least 5-10 garments to your Wardrobe before curating.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Sloane is Curating Rotation...";

      try {
        const data = await requestCuration({});

        currentCuration = data;
        curationVersion++;
        saveCuration();
        showBriefing(data.executiveBriefing);

        renderBoard();

      } catch (err) {
        console.error("Curation failure:", err);
        noticeBar.style.display = "block";
        noticeBar.innerText = "Sloane engine notice: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Curate Week with Sloane";
      }
    }

    // --- 6. VISION INTAKE & LIGHTBOX ---
    function openAddModal() {
      currentPhotoBase64 = null;
      document.getElementById("add-modal").style.display = "flex";
    }

    function closeAddModal() {
      document.getElementById("add-modal").style.display = "none";
      document.getElementById("camera-file-input").value = "";
      document.getElementById("vision-status").style.display = "none";
    }

    function openLightbox(src) {
      if (!src) return;
      document.getElementById("lightbox-img").src = src;
      document.getElementById("image-lightbox").style.display = "flex";
    }

    function closeLightbox() {
      document.getElementById("image-lightbox").style.display = "none";
    }

    async function handleImageIntake(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById("vision-status");
      status.style.display = "block";
      status.innerText = "Analyzing garment geometry and fabric signatures...";

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          // Downsample on an offscreen canvas to keep the payload small
          const img = await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error("Could not load image"));
            image.src = reader.result;
          });

          const MAX_DIMENSION = 1200;
          const scale = Math.min(1, MAX_DIMENSION / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

          currentPhotoBase64 = canvas.toDataURL("image/jpeg", 0.8);
          const res = await fetch(`${SUPABASE_URL}/functions/v1/tag-garment`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY
            },
            body: JSON.stringify({ imageBase64: currentPhotoBase64 })
          });

          const tags = await res.json();
          if (tags.error) throw new Error(tags.error);

          if (tags.brand) document.getElementById("piece-brand").value = tags.brand;
          if (tags.name) document.getElementById("piece-name").value = tags.name;
          if (tags.category) document.getElementById("piece-category").value = tags.category;
          if (tags.sub_category) document.getElementById("piece-subcategory").value = tags.sub_category;
          if (tags.color) document.getElementById("piece-color").value = tags.color;
          if (tags.formality) document.getElementById("piece-formality").value = tags.formality;

          status.innerText = "Analysis complete. Tags applied.";
        } catch (err) {
          status.innerText = "Vision analysis skipped: " + err.message;
        }
      };
      reader.readAsDataURL(file);
    }

    async function saveGarment() {
      const name = document.getElementById("piece-name").value.trim();
      const brand = document.getElementById("piece-brand").value.trim();
      const category = document.getElementById("piece-category").value;
      const sub_category = document.getElementById("piece-subcategory").value.trim();
      const color = document.getElementById("piece-color").value.trim();
      const formality = document.getElementById("piece-formality").value;

      if (!name) {
        alert("Please enter a garment name");
        return;
      }

      try {
        const payload = {
          name, brand, category, sub_category, color, formality
        };
        if (currentPhotoBase64) {
          payload.image_url = currentPhotoBase64;
        }

        const { error } = await supabaseClient.from("garments").insert([payload]);
        if (error) throw error;
        closeAddModal();
        await loadWardrobe();
      } catch (err) {
        alert("Failed to save garment: " + err.message);
      }
    }

    // --- 7. NAVIGATION ---
    function switchTab(tab) {
      document.getElementById("tab-board").style.display = tab === "board" ? "block" : "none";
      document.getElementById("tab-wardrobe").style.display = tab === "wardrobe" ? "block" : "none";
      document.getElementById("btn-nav-board").classList.toggle("active", tab === "board");
      document.getElementById("btn-nav-wardrobe").classList.toggle("active", tab === "wardrobe");
    }

    // --- 8. INITIALIZATION ---
    window.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("location-pill-label").innerText = currentLocation.name;
      restoreCuration();
      renderBoard();
      await fetchForecast(currentLocation.lat, currentLocation.lon);
      await loadWardrobe();
    });
  </script>
